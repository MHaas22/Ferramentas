<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Ferramentas de IA</title>
  <meta name="description" content="Coleção das minhas ferramentas de IA favoritas." />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #151922;
      --surface-2: #1c2230;
      --border: #262e3f;
      --text: #e7ebf3;
      --muted: #8b95a8;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1d1740 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 0%, #0d3a48 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 24px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
      background: var(--surface);
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      margin: 20px 0 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { color: var(--muted); max-width: 560px; margin: 0 auto; }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      transition: transform .15s, border-color .15s;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    main { max-width: 1100px; margin: 0 auto; padding: 0 24px 64px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .search {
      flex: 1 1 280px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }
    .chip.active { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      background: linear-gradient(180deg, var(--surface-2), var(--surface));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      animation: fadeIn .4s ease both;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px -12px rgba(124, 92, 255, .5);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; }
    .icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 22px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent-2);
    }
    .card h2 { font-size: 18px; }
    .card p { color: var(--muted); font-size: 14px; flex: 1; }
    .card a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      align-self: flex-start;
    }
    .card a:hover { color: var(--accent-2); }
    .empty { text-align: center; color: var(--muted); padding: 48px 0; display: none; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 24px;
      border-top: 1px solid var(--border);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <header>
    <span class="badge" id="count">Carregando ferramentas…</span>
    <h1>Minhas Ferramentas de IA</h1>
    <p class="subtitle">
      Uma coleção curada das ferramentas de inteligência artificial que eu uso no dia a dia.
    </p>
    <div class="actions">
      <a class="btn primary" id="repo-link" href="#" target="_blank" rel="noopener">
        ⭐ Ver repositório no GitHub
      </a>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Buscar ferramenta, categoria ou descrição…" aria-label="Buscar ferramentas" />
      <div class="chips" id="chips" role="toolbar" aria-label="Filtrar por categoria"></div>
    </div>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty">Nenhuma ferramenta encontrada para essa busca.</p>
  </main>

  <footer>
    Feito com HTML e JavaScript · <span id="year"></span>
  </footer>

  <script>
    // ============================================================
    // CONFIGURAÇÃO: edite aqui o seu repositório e a lista de ferramentas
    // ============================================================
    const GITHUB_REPO = "https://github.com/MHaas22/Ferramentas";

    const TOOLS = [
      {
        name: "Calculadora ICMS-ST MS",
        icon: "🧮",
        category: "Fiscal",
        description: "ICMS Substituição Tributária de Mato Grosso do Sul por XML, consulta ou lote. Base do Subanexo I e PMPF atualizados diariamente.",
        url: "icms-st-ms/"
      },
      {
        name: "ChatGPT",
        icon: "💬",
        category: "Chat",
        description: "Assistente conversacional para escrita, código, pesquisa e brainstorm.",
        url: "https://chatgpt.com"
      },
      {
        name: "Claude",
        icon: "🧠",
        category: "Chat",
        description: "Assistente para análise de documentos, escrita longa e programação.",
        url: "https://claude.ai"
      },
      {
        name: "Midjourney",
        icon: "🎨",
        category: "Imagem",
        description: "Geração de imagens artísticas a partir de descrições em texto.",
        url: "https://www.midjourney.com"
      },
      {
        name: "Cursor",
        icon: "⌨️",
        category: "Código",
        description: "Editor de código com IA integrada para escrever e refatorar projetos.",
        url: "https://cursor.com"
      },
      {
        name: "ElevenLabs",
        icon: "🎙️",
        category: "Áudio",
        description: "Síntese de voz realista e clonagem de voz com suporte a vários idiomas.",
        url: "https://elevenlabs.io"
      },
      {
        name: "Perplexity",
        icon: "🔎",
        category: "Pesquisa",
        description: "Busca na web com respostas resumidas e fontes citadas.",
        url: "https://www.perplexity.ai"
      }
    ];
    // ============================================================

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const chipsEl = document.getElementById("chips");
    const empty = document.getElementById("empty");
    const countEl = document.getElementById("count");
    const repoLink = document.getElementById("repo-link");

    let activeCategory = "Todas";

    repoLink.href = GITHUB_REPO;
    document.getElementById("year").textContent = new Date().getFullYear();

    const categories = ["Todas", ...new Set(TOOLS.map(t => t.category))];

    function renderChips() {
      chipsEl.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "chip" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          activeCategory = cat;
          renderChips();
          render();
        });
        chipsEl.appendChild(btn);
      });
    }

    function render() {
      const term = search.value.trim().toLowerCase();

      const filtered = TOOLS.filter(t => {
        const matchesCategory = activeCategory === "Todas" || t.category === activeCategory;
        const matchesSearch =
          !term ||
          t.name.toLowerCase().includes(term) ||
          t.description.toLowerCase().includes(term) ||
          t.category.toLowerCase().includes(term);
        return matchesCategory && matchesSearch;
      });

      grid.innerHTML = "";
      filtered.forEach(t => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-top">
            <div class="icon" aria-hidden="true">${t.icon}</div>
            <span class="tag">${t.category}</span>
          </div>
          <h2></h2>
          <p></p>
          <a href="${t.url}"${/^https?:/.test(t.url) ? ' target="_blank" rel="noopener"' : ""}>Acessar →</a>
        `;
        card.querySelector("h2").textContent = t.name;
        card.querySelector("p").textContent = t.description;
        grid.appendChild(card);
      });

      empty.style.display = filtered.length ? "none" : "block";
      countEl.textContent = `${filtered.length} de ${TOOLS.length} ferramentas`;
    }

    search.addEventListener("input", render);
    renderChips();
    render();
  </script>
</body>
</html>
